<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Hunger</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0f1626;
  color: #e6edf3;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(15, 22, 38, 0.92);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 40px;
  z-index: 1000;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo {
  font-size: 26px;
  font-weight: bold;
  color: #ff4d4d;
}

.nav-links a {
  text-decoration: none;
  color: #e6edf3;
  margin-left: 18px;
  padding: 10px 14px;
  border-radius: 8px;
  transition: 0.3s;
  font-weight: bold;
}

.nav-links a:hover {
  background: #ff4d4d;
  color: #0f1626;
}

/* HERO */
.hero {
  height: 65vh;
  margin-top: 70px;
  background: url('https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?q=80&w=1400&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

/* dark overlay */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(15, 22, 38, 0.35);
}

/* 🔥 HERO SOURCE (INSIDE IMAGE) */
.hero-source {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  background: rgba(0,0,0,0.35);
  padding: 4px 10px;
  border-radius: 8px;
  color: rgba(255,255,255,0.85);
  backdrop-filter: blur(6px);
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: 3;
}

.hero-content h1 {
  font-size: 64px;
  margin-bottom: 20px;
}

.hero-content p {
  max-width: 700px;
  font-size: 20px;
  color: #cbd5e1;
  margin: auto;
}

/* BUTTON */
.hero-content button {
  margin-top: 25px;
  padding: 14px 30px;
  border: none;
  background: linear-gradient(135deg, #ff4d4d, #ff2e2e);
  color: white;
  font-size: 18px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.25s ease;
}

.hero-content button:hover {
  transform: translateY(-3px) scale(1.03);
}

/* CARDS */
.cards-container {
  padding: 100px 10%;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* YOUR ORIGINAL ANIMATION (UNCHANGED LOGIC) */
.info-card {
  display: flex;
  gap: 40px;
  background: rgba(255,255,255,0.04);
  padding: 40px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);

  opacity: 0;
  transform: translateY(30px);
  transition: all 0.7s ease;
}

.info-card.show {
  opacity: 1;
  transform: translateY(0);
}

.image-box {
  position: relative;
}

.image-box img {
  width: 460px;
  height: 300px;
  object-fit: cover;
  border-radius: 14px;
}

.img-source {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  background: rgba(0,0,0,0.4);
  padding: 4px 10px;
  border-radius: 8px;
  color: white;
}

.card-content h2 {
  font-size: 36px;
  margin-bottom: 12px;
  color: #ff4d4d;
}

.card-content p {
  font-size: 19px;
  color: #d1dbe8;
  line-height: 1.7;
}
</style>
</head>

<body>

<nav>
  <div class="logo">WORLD HUNGER</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="page.html">Causes</a>
    <a href="page2.html">Solutions</a>
    <a href="page3.html">Work Cited</a>
    <a href="page4.html">Image Cited</a>
  </div>
</nav>
